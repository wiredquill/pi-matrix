apiVersion: v1
kind: Service
metadata:
  name: matrix-update-server
  namespace: matrix-system
  labels:
    app: matrix-update-server
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: matrix-update-server
  # Optional: Specify external traffic policy for better performance
  externalTrafficPolicy: Local